version: '3.8'

services:
  backend:
    build:
      context: ./codeguard_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your environment before starting Compose}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - codeguard-network

  frontend:
    build:
      context: ./gdpr-agent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - codeguard-network

networks:
  codeguard-network:
    driver: bridge
