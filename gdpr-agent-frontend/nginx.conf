# Configuração robusta do Nginx para aplicações Single Page (Angular)

server {
    listen 80;
    # Define o diretório onde o Nginx buscará os arquivos estáticos
    root /usr/share/nginx/html;

    # O índice (página inicial) é o index.html
    index index.html;

    # Configuração para arquivos estáticos:
    # Tenta servir o arquivo solicitado diretamente. Se não conseguir,
    # cai para o 'location /' abaixo.
    try_files $uri $uri/ /index.html;

    # Tratamento principal de rotas (Critical for Angular Routing)
    location / {
        # Se um arquivo não existir, redireciona o Nginx para servir o index.html
        # Isso permite que o Angular Router assuma o controle da navegação
        try_files $uri $uri/ /index.html;
    }

    # Configuração de Proxy para o Backend (Java)
    # Exemplo: Se o frontend faz uma chamada para /api/v1/health
    location /api/ {
        # Importante: O nome 'backend' é o nome do serviço no docker-compose.yml
        proxy_pass http://backend:8080; 
        
        # Headers necessários para comunicação entre contêineres
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Adicione mais 'location /servico/' se precisar de proxy para o ai-engine
    # Exemplo:
    # location /ai/ {
    #     proxy_pass http://ai-engine:5000;
    # }

    # Configuração de compressão para servir arquivos mais rápido
    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml application/json;
    gzip_proxied any;
}